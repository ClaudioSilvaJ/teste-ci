name: CI

on:
  push:
    tags: ["v*"]
    branches:
      - main
  pull_request:


jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  imagem:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: docker build -t biblioteca-ci:latest .
      - name: Sobe um container e chama /saude
        run: |
          docker run -d --name biblioteca-ci -p 8000:8000 biblioteca-ci:latest
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/saude; then exit 0; fi
            sleep 1
          done
          docker logs biblioteca-ci
          exit 1
  publicar-imagem:
      if: startsWith(github.ref, 'refs/tags/v')
      permissions:
        contents: read
        packages: write
      needs: imagem
      runs-on: ubuntu-latest
                          # permissão para escrever no registro
      steps:
        - uses: actions/checkout@v7
        - name: Nome da imagem (o registro exige minúsculas)
          run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        - run: docker build -t "$IMAGEM:latest" -t "$IMAGEM:${GITHUB_SHA::7}" .
        - name: Login no registro
          run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        - run: docker push --all-tags "$IMAGEM"

  release:
      needs: publicar-imagem
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v7
        - env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
          
  deploy-railway:
      needs: [imagem]
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      environment:
        name: producao
      steps:
        - uses: actions/checkout@v7
        - name: Instala o Railway CLI
          run: npm install -g @railway/cli
        - name: Envia o código; o Railway constrói o Dockerfile e publica
          env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          run: railway up --service "${{ vars.RAILWAY_SERVICE_ID }}" --ci